[package]
name = "markdown-viewer"
version = "0.1.0"
description = "Local-first Markdown viewer and editor (PRD v2.0)"
authors = ["Marquellium contributors"]
edition = "2021"

[lib]
# The Tauri app is built as a lib so integration tests (file durability,
# conflict handling, registry semantics) can drive it without launching a GUI.
name = "markdown_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
sha2 = "0.10"
hex = "0.4"
png = "=0.18.1"
base64 = "=0.23.1"
notify = "8"
walkdir = "2"
rfd = "0.15"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "process", "io-util"] }
open = "5.3.0"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-single-instance = "=2.5.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSResponder"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
